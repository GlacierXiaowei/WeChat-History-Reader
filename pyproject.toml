[build-system]
requires = ["setuptools>=68", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-history-reader"
version = "2.1.1"
description = "Let AI agents read, find, and summarize local WeChat chats."
requires-python = ">=3.10"
dependencies = [
  "pycryptodome>=3.23,<4",
  "zstandard>=0.22,<1",
]

[tool.setuptools]
packages = ["wechat_history_reader"]
