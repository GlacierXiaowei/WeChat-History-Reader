[build-system]
requires = ["setuptools>=68", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "get-wechat-history"
version = "2.0.0"
description = "Read compact local WeChat history through a focused read-only MCP server."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.26,<2",
  "pycryptodome>=3.23,<4",
  "zstandard>=0.22,<1",
]

[tool.setuptools]
packages = ["get_wechat_history"]
